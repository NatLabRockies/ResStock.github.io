title: ResStock
description: ResStock Documentation
# theme: just-the-docs
remote_theme: pmarsceill/just-the-docs
# Host only. GitHub Pages adds baseurl (/ResStock.github.io) for this project site,
# so canonical tags and the sitemap resolve to https://natlabrockies.github.io/ResStock.github.io/...
url: https://natlabrockies.github.io
# Full address of the published site, used to match pages against the BuildStock corpus
# (_data/corpus_index.json records each document's publication_url on this host).
live_url: https://natlabrockies.github.io/ResStock.github.io
logo: "/assets/images/logo.svg"
favicon_ico: "/assets/images/favicon.ico"
search_enabled: true
aux_links:
  "ResStock on GitHub":
    - "https://github.com/NatLabRockies/resstock"
aux_links_new_tab: true

# jekyll-sitemap is on the GitHub Pages plugin whitelist; it writes /sitemap.xml
# (named in robots.txt) so crawlers and AI indexers can find every page.
plugins:
  - jekyll-sitemap

footer_content: >
  The National Laboratory of the Rockies is a national laboratory of the
  <a href="https://www.energy.gov">U.S. Department of Energy</a>,
  <a href="https://www.energy.gov/cmei/office-critical-minerals-and-energy-innovation">Office of Critical Minerals and Energy Innovation</a>,
  operated under Contract No. DE-AC36-08GO28308
color_scheme: general
callouts:
  warning:
    title: Warning
    color: red
  publication:
    color: blue
    opacity: 0.1
  relatedwork:
    color: yellow
    opacity: 0.1
  othermedia:
    color: grey-dk
    opacity: 0.1

# Google Analytics Tracking (optional)
# Supports a CSV of tracking ID strings (eg. "UA-1234567-89,G-1AB234CDE5")
ga_tracking: G-5WNQG7LNVD
ga_tracking_anonymize_ip: true # Use GDPR compliant Google Analytics settings (true/nil by default)
